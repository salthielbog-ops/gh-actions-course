name: 07 - Using Expressions
on:
  #push:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false
run-name: "07 - Using Expressions | DEBUG - ${{ inputs.debug == true && 'ON' || 'OFF' }}"
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
    - name: "[debug] Print start-up data"
      if: ${{ inputs.debug == true }}
      run: |
        echo " Triggered by: ${{github.event_name}} "
        echo "Branch: ${{github.ref}} "
        echo "Commit SHA: ${{github.sha}} "
        echo "Runner OS: ${{runner.os}} "
    - name: "[debug] Print when triggered from main"
      if: ${{github.ref == 'refs/heads/main' && inputs.debug == true}}
      run: |
        echo "This workflow was triggered from the main branch."
    - name: "Greeting"
      run: |
        echo "Hello, ${{github.actor}}! This workflow is running on a ${{runner.os}} runner."
